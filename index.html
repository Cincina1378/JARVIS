
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020711;color:#bceeff;font-family:Arial;overflow:hidden}
#standby{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:10}
#standby h1{letter-spacing:12px;text-shadow:0 0 30px #00aeff;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
#boot{display:none;position:fixed;inset:0;background:#01050c;z-index:9;place-items:center;flex-direction:column}
#boot.show{display:flex}
#boot h1{font-size:clamp(30px,8vw,65px);letter-spacing:10px;text-shadow:0 0 25px #00aeff;transition:1.5s}
#boot h1.move{transform:translateX(35vw) scale(.3)}
#bootText{font:12px monospace;line-height:2;text-align:center;color:#65dfff}
#app{display:none;position:fixed;inset:0;background:radial-gradient(circle,#092d49,#020711 65%)}
#app.active{display:block}
#top{position:absolute;top:15px;left:20px;right:20px;display:flex;justify-content:space-between;font:12px monospace;letter-spacing:3px}
.panel{position:absolute;width:230px;padding:13px;border:1px solid #168dc4;background:#041b2dcc;box-shadow:0 0 20px #008cff33;backdrop-filter:blur(8px)}
.panel h3{font-size:11px;letter-spacing:2px;color:#67dfff}
.panel p{font-size:12px;line-height:1.5}
#weather{top:15%;left:15px}
#status{top:15%;right:15px}
#notes{bottom:20px;left:15px}
#chat{bottom:20px;right:15px;width:min(330px,45vw)}
#chatLog{height:100px;overflow:auto;font-size:12px}
#chatInput{width:100%;padding:10px;background:#00101d;color:white;border:1px solid #168dc4}
#core{position:absolute;left:50%;top:50%;width:min(48vw,400px);aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid #25caff;border-radius:50%;box-shadow:0 0 35px #008cff,inset 0 0 30px #008cff;animation:rotate 12s linear infinite}
#core:before,#core:after{content:"";position:absolute;inset:12%;border:1px dashed #57dfff;border-radius:50%}
#core:after{inset:27%;border-style:solid}
@keyframes rotate{to{transform:translate(-50%,-50%) rotate(360deg)}}
#coreText{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:13px monospace;letter-spacing:4px;text-align:center}
#ultron{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:240px;border:2px solid #55dfff;background:linear-gradient(130deg,#164d70,#061322);clip-path:polygon(20% 0,80% 0,100% 35%,85% 100%,15% 100%,0 35%);filter:drop-shadow(0 0 20px #00aaff)}
#ultron.show{display:block;animation:appear 1s}
#ultron:before{content:"";position:absolute;top:35%;left:15%;right:15%;height:20%;border-top:3px solid #aafaff;border-bottom:3px solid #aafaff;box-shadow:0 0 20px #00bfff}
@keyframes appear{from{opacity:0;transform:translate(-50%,-50%) scale(.1)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#camera{position:fixed;right:8px;bottom:8px;width:110px;opacity:.3;transform:scaleX(-1)}
#bottom{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:10px monospace;letter-spacing:3px}
@media(max-width:650px){
.panel{width:42vw;padding:8px}
#weather{top:12%;left:5px}
#status{top:12%;right:5px}
#notes{bottom:7%;left:5px}
#chat{bottom:7%;right:5px}
#core{width:45vw}
}
</style>
</head>
<body>

<div id="standby"><h1>J.A.R.V.I.S.</h1></div>

<div id="boot">
<div id="bootLogo"><h1>J.A.R.V.I.S.</h1></div>
<div id="bootText"></div>
</div>

<div id="app">
<div id="top">
<span>STARK INDUSTRIES // J.A.R.V.I.S.</span>
<span id="clock"></span>
</div>

<div id="core"></div>
<div id="coreText">J.A.R.V.I.S.<br>ONLINE</div>
<div id="ultron"></div>

<div class="panel" id="weather">
<h3>ATMOSPHERIC DATA</h3>
<p id="weatherText">Konum bekleniyor...</p>
<p id="weatherMore"></p>
</div>

<div class="panel" id="status">
<h3>SYSTEM STATUS</h3>
<p id="micStatus">MIC: WAITING</p>
<p id="camStatus">CAM: WAITING</p>
<p id="handStatus">HAND: SEARCHING</p>
<p>AI: ONLINE</p>
</div>

<div class="panel" id="notes">
<h3>PERSONAL MEMORY</h3>
<p id="noteText">Henüz not yok.</p>
</div>

<div class="panel" id="chat">
<h3>J.A.R.V.I.S. COMMUNICATION</h3>
<div id="chatLog"></div>
<input id="chatInput" placeholder="Konuş veya yaz..." autocomplete="off">
</div>

<div id="bottom">TWO CLAPS // ACTIVATE SYSTEM</div>
</div>

<video id="camera" autoplay playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const $=id=>document.getElementById(id);

let active=false;
let micStream=null;
let cameraStream=null;
let audioContext=null;
let analyser=null;
let recording=false;
let recorder=null;
let chunks=[];
let lastSound=0;
let claps=[];
let processing=false;
let voiceEnabled=true;
let hands=null;
let cameraRunner=null;

const clientId=localStorage.getItem("jarvis-client")||crypto.randomUUID();
localStorage.setItem("jarvis-client",clientId);

let history=JSON.parse(localStorage.getItem("jarvis-history")||"[]");

function log(who,text){
 const p=document.createElement("p");
 p.textContent=who+": "+text;
 $("chatLog").appendChild(p);
 $("chatLog").scrollTop=$("chatLog").scrollHeight;
}

function speak(text){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang="tr-TR";
 u.rate=1;
 u.pitch=.9;
 const v=speechSynthesis.getVoices();
 u.voice=v.find(x=>x.lang.toLowerCase().startsWith("tr"))||null;
 speechSynthesis.speak(u);
}

function clock(){
 $("clock").textContent=new Date().toLocaleString("tr-TR");
}
setInterval(clock,1000);
clock();

async function startMicrophone(){
 if(micStream)return true;
 try{
  micStream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   }
  });
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
  const source=audioContext.createMediaStreamSource(micStream);
  analyser=audioContext.createAnalyser();
  analyser.fftSize=2048;
  source.connect(analyser);
  $("micStatus").textContent="MIC: ACTIVE";
  listenAudio();
  return true;
 }catch(e){
  $("micStatus").textContent="MIC: PERMISSION DENIED";
  log("SYSTEM","Mikrofon izni gerekli.");
  return false;
 }
}

function listenAudio(){
 const data=new Uint8Array(analyser.fftSize);

 function loop(){
  if(!micStream)return;

  analyser.getByteTimeDomainData(data);
  let sum=0,peak=0;

  for(const v of data){
   const n=(v-128)/128;
   sum+=n*n;
   peak=Math.max(peak,Math.abs(n));
  }

  const rms=Math.sqrt(sum/data.length);
  const now=Date.now();

  // İki alkış algılama
  if(rms>.23&&peak>.48){
   claps.push(now);
   claps=claps.filter(t=>now-t<900);
   if(claps.length>=2){
    claps=[];
    toggleSystem();
   }
  }

  // Sistem açıkken ses kaydı
  if(active&&voiceEnabled&&!processing&&rms>.035){
   lastSound=now;
   if(!recording)beginRecording();
  }

  if(recording&&now-lastSound>1000)stopRecording();

  requestAnimationFrame(loop);
 }
 loop();
}

function beginRecording(){
 if(!micStream||recording||!window.MediaRecorder)return;
 try{
  chunks=[];
  const type=MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"";
  recorder=new MediaRecorder(micStream,type?{mimeType:type}:undefined);
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=async()=>{
   const blob=new Blob(chunks,{type:recorder.mimeType||"audio/mp4"});
   if(blob.size>2000)await transcribe(blob);
  };
  recorder.start();
  recording=true;
  $("bottom").textContent="LISTENING // SPEAK NOW";
 }catch(e){recording=false;}
}

function stopRecording(){
 if(!recording)return;
 recording=false;
 try{recorder.stop()}catch(e){}
}

async function transcribe(blob){
 processing=true;
 try{
  const fd=new FormData();
  fd.append("audio",blob,"voice.m4a");
  const r=await fetch("/api?action=transcribe",{method:"POST",body:fd});
  const j=await r.json();
  if(!r.ok)throw Error(j.error||"Ses tanınamadı.");
  const text=(j.text||"").trim();
  if(text){
   log("YOU",text);
   await command(text);
  }
 }catch(e){
  log("ERROR",e.message);
 }finally{
  processing=false;
  $("bottom").textContent="J.A.R.V.I.S. ONLINE";
 }
}

async function toggleSystem(){
 if(active)shutdown();
 else await boot();
}

async function boot(){
 if(active)return;
 const ok=await startMicrophone();
 if(!ok)return;

 active=true;
 startCamera();

 $("standby").style.display="none";
 $("boot").classList.add("show");

 const lines=[
  "NEURAL NETWORK INITIALIZING...",
  "AUDIO CHANNEL CONNECTED...",
  "VISUAL SENSORS CONNECTED...",
  "HOLOGRAPHIC CORE ONLINE...",
  "PERSONAL ASSISTANT READY..."
 ];

 let i=0;
 $("bootText").textContent="";

 const timer=setInterval(()=>{
  $("bootText").textContent+=lines[i]+"\n";
  i++;
  if(i>=lines.length){
   clearInterval(timer);
   setTimeout(()=>{
    $("bootLogo").querySelector("h1").classList.add("move");
    setTimeout(()=>{
     $("boot").classList.remove("show");
     $("app").classList.add("active");
     $("bottom").textContent="J.A.R.V.I.S. ONLINE // LISTENING";
     speak("İyi akşamlar. JARVIS çevrimiçi. Komutlarınızı bekliyorum.");
     getWeather();
    },1500);
   },500);
  }
 },650);
}

function shutdown(){
 active=false;
 $("app").classList.remove("active");
 $("boot").classList.remove("show");
 $("standby").style.display="grid";
 $("bottom").textContent="TWO CLAPS // ACTIVATE SYSTEM";
 $("ultron").classList.remove("show");
 speechSynthesis.cancel();
}

async function startCamera(){
 if(cameraStream)return;
 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"user",width:640,height:480},
   audio:false
  });
  $("camera").srcObject=cameraStream;
  $("camStatus").textContent="CAM: ACTIVE";
  setupHands();
 }catch(e){
  $("camStatus").textContent="CAM: PERMISSION DENIED";
 }
}

function setupHands(){
 if(!window.Hands||cameraRunner)return;

 hands=new Hands({
  locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f
 });

 hands.setOptions({
  maxNumHands:2,
  modelComplexity:1,
  minDetectionConfidence:.65,
  minTrackingConfidence:.6
 });

 hands.onResults(results=>{
  if(!active)return;
  const hand=results.multiHandLandmarks?.[0];

  if(!hand){
   $("handStatus").textContent="HAND: SEARCHING";
   return;
  }

  $("handStatus").textContent="HAND: DETECTED";

  const x=1-hand[8].x;
  const y=hand[8].y;

  $("core").style.filter=
   `hue-rotate(${(x-.5)*80}deg)`;

  const pinch=Math.hypot(
   hand[4].x-hand[8].x,
   hand[4].y-hand[8].y
  )<.055;

  if(pinch){
   const el=document.elementFromPoint(
    x*innerWidth,y*innerHeight
   )?.closest(".panel");

   if(el){
    el.style.left=(x*innerWidth-80)+"px";
    el.style.top=(y*innerHeight-30)+"px";
    el.style.right="auto";
    el.style.bottom="auto";
   }
  }

  const fist=hand[8].y>hand[6].y&&
   hand[12].y>hand[10].y&&
   hand[16].y>hand[14].y&&
   hand[20].y>hand[18].y;

  if(fist&&!window.gestureLock){
   window.gestureLock=true;
   toggleUltron(true);
   setTimeout(()=>window.gestureLock=false,2000);
  }
 });

 cameraRunner=new Camera($("camera"),{
  onFrame:async()=>{
   if(active&&cameraStream)await hands.send({image:$("camera")});
  },
  width:640,
  height:480
 });
 cameraRunner.start();
}

function toggleUltron(show){
 $("ultron").classList.toggle("show",show);
 $("coreText").innerHTML=show?"ULTRON HOLOGRAM":"J.A.R.V.I.S.<br>ONLINE";
 speak(show?"Ultron hologramı etkinleştirildi.":"JARVIS sistemine geri dönüldü.");
}

async function getWeather(){
 if(!navigator.geolocation)return;
 navigator.geolocation.getCurrentPosition(async pos=>{
  try{
   const {latitude,longitude}=pos.coords;
   const url=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
   const r=await fetch(url);
   const j=await r.json();
   const c=j.current;
   $("weatherText").textContent=
    `${Math.round(c.temperature_2m)}°C · Hissedilen ${Math.round(c.apparent_temperature)}°C`;
   $("weatherMore").textContent=
    `Nem %${c.relative_humidity_2m} · Rüzgâr ${c.wind_speed_10m} km/sa · Günlük ${Math.round(j.daily.temperature_2m_min[0])}°/${Math.round(j.daily.temperature_2m_max[0])}°`;
  }catch(e){
   $("weatherText").textContent="Hava durumu alınamadı.";
  }
 },()=>{$("weatherText").textContent="Konum izni verilmedi.";});
}

async function askAI(text){
 history.push({role:"user",content:text});
 history=history.slice(-16);

 const r=await fetch("/api",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({action:"chat",clientId,messages:history})
 });

 const j=await r.json();
 if(!r.ok)throw Error(j.error||"AI bağlantı hatası.");

 const reply=j.reply||"Yanıt oluşturulamadı.";
 history.push({role:"assistant",content:reply});
 localStorage.setItem("jarvis-history",JSON.stringify(history));
 return reply;
}

async function command(raw){
 const t=raw.toLocaleLowerCase("tr-TR");

 if(t.includes("sistemi kapat")||t.includes("jarvis kapan")){
  speak("Sistem bekleme moduna alınıyor.");
  setTimeout(shutdown,1000);
  return;
 }

 if(t.includes("ultron")&&(t.includes("çağır")||t.includes("göster"))){
  toggleUltron(true);return;
 }

 if(t.includes("jarvis")&&t.includes("geri dön")){
  toggleUltron(false);return;
 }

 if(t.includes("esneme")){
  $("core").animate([
   {transform:"translate(-50%,-50%) scale(1)"},
   {transform:"translate(-50%,-50%) scale(1.3,.8)"},
   {transform:"translate(-50%,-50%) scale(1)"}
  ],{duration:1800});
  speak("Esneme animasyonu başlatıldı.");
  return;
 }

 if(t.includes("hava durumu")){
  getWeather();
  speak("Hava durumu yenileniyor.");
  return;
 }

 if(t.includes("not al")){
  const note=raw.replace(/not al/i,"").trim();
  const notes=JSON.parse(localStorage.getItem("jarvis-notes")||"[]");
  notes.push(note);
  localStorage.setItem("jarvis-notes",JSON.stringify(notes));
  $("noteText").textContent="Son not: "+note;
  speak("Not kaydedildi.");
  return;
 }

 if(t.includes("notları göster")){
  const notes=JSON.parse(localStorage.getItem("jarvis-notes")||"[]");
  const text=notes.slice(-5).join(". ")||"Not bulunmuyor.";
  log("JARVIS",text);
  speak(text);
  return;
 }

 if(t.includes("kamerayı kapat")){
  cameraStream?.getTracks().forEach(t=>t.stop());
  cameraStream=null;
  $("camStatus").textContent="CAM: OFF";
  speak("Kamera kapatıldı.");
  return;
 }

 if(t.includes("mikrofonu kapat")){
  voiceEnabled=false;
  speak("Sesli komut tanıma kapatıldı. Alkış algılama açık.");
  return;
 }

 if(t.includes("mikrofonu aç")||t.includes("sesi aç")){
  voiceEnabled=true;
  speak("Sesli komutlar açık.");
  return;
 }

 try{
  $("bottom").textContent="JARVIS // PROCESSING";
  const reply=await askAI(raw);
  log("JARVIS",reply);
  speak(reply);
 }catch(e){
  log("SYSTEM",e.message);
  speak("Bağlantı hatası. "+e.message);
 }
}

$("chatInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  const v=e.target.value.trim();
  if(v){
   e.target.value="";
   log("YOU",v);
   command(v);
  }
 }
});

// İlk ziyaret: izinleri iste. iPad Safari izin için kullanıcı dokunuşu isteyebilir.
window.addEventListener("load",()=>{
 startMicrophone();
});
$("standby").addEventListener("click",()=>{
 startMicrophone();
});
})();
</script>
</body>
</html>
